# Window rules
# mango 没有 class 字段，appid 就是 Wayland app_id / X11 WM_CLASS
# Mango 0.16.1 会自动浮动 transient/modal/dialog/splash/utility/toolbar
# 以及固定尺寸窗口；下面只补应用没有正确声明窗口类型时的例外。

# 用 --class float 启动的窗口（例如 wezterm start --class float）
windowrule=isfloating:1,width:0.6,height:0.7,appid:^float$

# Noctalia Settings 是普通窗口，不能进 tile
windowrule=isfloating:1,width:1080,height:920,offsetx:0,offsety:0,appid:^dev\.noctalia\.Noctalia$

windowrule=isfloating:1,isnoborder:1,isnoshadow:1,isnoradius:1,noblur:1,focused_opacity:1,unfocused_opacity:1,appid:^bongo-cat$,title:^BongoCat$

# 已装：通讯 / 音乐 / 代理
windowrule=isnoanimation:1,animation_type_open:none,animation_type_close:none,nofadein:1,nofadeout:1,isnoborder:1,isnoshadow:1,isnoradius:1,noblur:1,focused_opacity:1,unfocused_opacity:1,appid:^wechat$,title:^wechat$
windowrule=isfloating:1,appid:^broken$

windowrule=isfloating:1,appid:^wechat$

windowrule=isfloating:1,appid:^yesplaymusic$
windowrule=isfloating:1,appid:^mihomo-party$

# 已装：系统工具 / 截图 / 输入法 / 授权
