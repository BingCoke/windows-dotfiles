# 文件对话框回退：完整标题匹配，避免误伤标题中包含关键词的普通窗口
windowrule=isfloating:1,title:^(Open File|Open Files|Save File|Save As|Open Folder|Select File|Select Files|Select Folder|Choose File|Choose Files|Choose Folder|打开文件|打开多个文件|保存文件|另存为|打开文件夹|选择文件|选择多个文件|选择文件夹)$

# RustDesk 所有窗口浮动且保持完全不透明
windowrule=isfloating:1,focused_opacity:1,unfocused_opacity:1,appid:^rustdesk$


