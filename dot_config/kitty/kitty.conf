include themes/noctalia.conf

enable_audio_bell no

# Font
font_family IntoneMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 16.0

symbol_map U+2E80-U+2EFF,U+3000-U+303F,U+31C0-U+31EF,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF Noto Sans Mono CJK SC
symbol_map U+1F300-U+1FAFF Noto Color Emoji

# Cursor
cursor_shape block
cursor_shape_unfocused block
cursor_blink_interval 0
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

#shell_integration enabled no-cursor
shell_integration enabled no-cursor

# Window
background_opacity 0.98
window_padding_width 0 2 0 2
confirm_os_window_close 0

linux_display_server auto

# Tabs
tab_bar_edge top
tab_bar_style separator
tab_bar_align left
tab_bar_min_tabs 1
tab_bar_min_tabs 1
tab_title_template "{fmt.fg._83b6af}{fmt.bg.default}  {index}:{f'{title[:6]}…{title[-6:]}' if title.rindex(title[-1]) + 1 > 25 else title}{' []' if layout_name == 'stack' else ''} "
active_tab_title_template "{fmt.fg._9fcfc8}{fmt.bg.default}  {index}:{f'{title[:6]}…{title[-6:]}' if title.rindex(title[-1]) + 1 > 25 else title}{' []' if layout_name == 'stack' else ''} "
tab_separator ""

# Selection and scrollback
copy_on_select clipboard
scrollback_lines 10000

# kitty-scrollback.nvim
allow_remote_control socket-only
listen_on unix:/tmp/kitty
action_alias kitty_scrollback_nvim kitten '${HOME}/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py'

# 完整 scrollback: Ctrl+Shift+H
map kitty_mod+h kitty_scrollback_nvim

# 上一个命令的输出: Ctrl+Shift+G
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output

# 鼠标选中的命令输出: Ctrl+Shift+右键
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# 兼容原来的快捷键: Ctrl+Shift+E 打开完整 scrollback
map ctrl+shift+e kitty_scrollback_nvim

# WezTerm-compatible mouse bindings
#mouse_map ctrl+left press grabbed,ungrabbed discard_event
#mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link
mouse_map right press grabbed,ungrabbed paste_from_clipboard
#mouse_map middle press grabbed,ungrabbed close_tab

# WezTerm-compatible key bindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+; send_text all \x1c\x0e

map f13 discard_event
map ctrl+q close_tab

map ctrl+shift+enter new_os_window_with_cwd
map ctrl+enter launch --type=tab --cwd=last_reported
map ctrl+alt+enter new_tab

map ctrl+alt+l next_tab
map ctrl+alt+h previous_tab
map ctrl+alt+j move_tab_forward
map ctrl+alt+k move_tab_backward

map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9

map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0


enabled_layouts splits

# 在当前工作目录创建分屏
map ctrl+shift+- launch --location=hsplit --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current

# 在 pane 间移动焦点
map ctrl+shift+H neighboring_window left
map ctrl+shift+L neighboring_window right
map ctrl+shift+K neighboring_window top
map ctrl+shift+J neighboring_window bottom

# 关闭当前 pane
map ctrl+shift+w close_window
